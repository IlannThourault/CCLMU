<div class="champs-recherche-container">
  <h3>Filtres ajoutés ({{ nombreChamps() }}/2)</h3>
  
  <div *ngIf="champs().length === 0" class="message-vide">
    <p>Aucun filtre ajouté.</p>
  </div>

  <div class="liste-champs" *ngIf="champs().length > 0">
    <div *ngFor="let champ of champs()" class="champ-item-inline">
      <span class="champ-valeur">
        {{ champ.valeur }}
      </span>
      <button 
        (click)="supprimerChamp(champ.id)"
        class="btn-supprimer-inline"
        title="Supprimer"
      >
        ✕
      </button>
    </div>
  </div>
</div>
