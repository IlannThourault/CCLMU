<div *ngFor="let project of projects" class="project-card">
  <h2>{{ project.title }}</h2>
  <p>{{ project.teaser }}</p>
  <p><b>Début:</b> {{ project.startDate }} | <b>Fin:</b> {{ project.endDate }}</p>
  <div>
    <b>Contributeurs:</b>
    <ul>
      <li *ngFor="let c of project.allContributors">{{ c }}</li>
    </ul>
  </div>
</div>
